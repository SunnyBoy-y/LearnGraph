<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>LearnGraph</title>
  <style>
    body { margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
           background: #fcfcfc; font-family: system-ui, "Segoe UI", sans-serif; color: #262626; }
    .box { text-align: center; }
    .spin { width: 28px; height: 28px; margin: 0 auto 14px; border-radius: 50%;
            border: 3px solid #e5e5e5; border-top-color: #4f46e5; animation: r 0.9s linear infinite; }
    @keyframes r { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="box">
    <div class="spin"></div>
    <div>LearnGraph 正在启动…</div>
  </div>
</body>
</html>
