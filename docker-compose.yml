name: learngraph

# Self-hosted LearnGraph. Production shape matches the source-launch topology
# (one Web/API entry + one preview origin), not the dev-server ports:
#   - Web + API are same-origin on ONE entry port (the API serves the built
#     frontend), so the browser needs a single address.
#   - The subapp preview is a separate origin the browser loads in an iframe
#     (capability-token authorized), so it gets its own published port.
#   - The API's internal port 8000 is NOT published separately.
#
# Defaults bind to 127.0.0.1 only and use high ports (18000/18001) to avoid
# collisions with common dev ports. For LAN/public exposure set
# LEARNGRAPH_LISTEN_HOST=0.0.0.0 (mirrors `npm run dev -- --lan`) plus your
# own LEARNGRAPH_PORT / LEARNGRAPH_PREVIEW_PORT.
#
#   docker compose up --build
#   open http://127.0.0.1:18000
#
# Provider secrets use the environment master-key provider. When
# LEARNGRAPH_MASTER_KEY is unset, the entrypoint generates one and stores it
# on the data volume so encrypted keys survive restarts.
#
# Sandbox is fully self-contained: the stack includes its own sandboxd
# control plane (the only component that mounts the host Docker socket), so
# `docker compose up --build` gives you sandbox execution out of the box on
# Docker Desktop (Windows/macOS) and native Linux — no host Node or manual
# daemon needed. The daemon self-bootstraps its auth tokens into the shared
# `sandboxd-state` volume on first start. Operators who prefer reviewed
# file-based credentials can keep the hardening override:
#   docker compose -f docker-compose.yml -f docker-compose.sandbox.yml up -d
#
# Reviewed outbound egress (审批制出网) is fully wired: the egress-proxy
# service is the only component with internet egress for sandboxes. Dynamic
# sandbox containers join the internal `learngraph-egress` network and can
# only reach the proxy, which re-authorizes every CONNECT against the
# workspace policy digest (see backend/app/services/sandbox_network_policy.py).
#
# SQLite plus the embedded schedulers are single-process. Do not raise uvicorn
# --workers above 1.
#
# Host loopback services (Ollama, LM Studio, local HTTP MCP, local APIs) are
# NOT reachable from inside the app container: 127.0.0.1 in a container is the
# container itself. The recommended production shape is the Host Service
# Bridge (see doc/host-service-bridge.md): a host-side daemon exposes only
# registered services, and the backend rewrites loopback provider URLs to it
# (LEARNGRAPH_HOST_BRIDGE_URL). The extra_hosts entry below is the transport
# prerequisite for that bridge (and a deliberate escape hatch for direct
# host.docker.internal access in dev): it makes the Docker gateway resolvable
# on both Docker Desktop and native Linux Docker.

x-app-environment: &app-environment
  LEARNGRAPH_ENV: ${LEARNGRAPH_ENV:-development}
  LEARNGRAPH_DEPLOYMENT_PROFILE: ${LEARNGRAPH_DEPLOYMENT_PROFILE:-self_hosted_team}
  LEARNGRAPH_SECRET_PROVIDER: environment
  LEARNGRAPH_MASTER_KEY: ${LEARNGRAPH_MASTER_KEY:-}
  LEARNGRAPH_BOOTSTRAP_ADMIN_PASSWORD: ${LEARNGRAPH_BOOTSTRAP_ADMIN_PASSWORD:-}
  LEARNGRAPH_FRONTEND_DIST: /app/frontend-dist
  LEARNGRAPH_DATA_ROOT: /data
  LEARNGRAPH_DATABASE_URL: sqlite:////data/learngraph.db
  LEARNGRAPH_STORAGE_ROOT: /data/storage
  LEARNGRAPH_MEMORY_ROOT: /data/memory
  LEARNGRAPH_SANDBOX_WORKSPACE_ROOT: /data/sandbox-workspaces
  LEARNGRAPH_SANDBOX_EGRESS_POLICY_DIR: /data/egress-policies
  LEARNGRAPH_SUBAPP_PREVIEW_ORIGIN: ${LEARNGRAPH_SUBAPP_PREVIEW_ORIGIN:-http://127.0.0.1:18001}
  LEARNGRAPH_SUBAPP_PREVIEW_PORT: "8001"
  # Host Service Bridge endpoint on the real machine. Leave EMPTY (default):
  # containerized profiles auto-derive http://host.docker.internal:34115
  # (see backend Settings.effective_host_bridge_url). Set explicitly only to
  # override (custom port/host) or to point at a remote bridge.
  LEARNGRAPH_HOST_BRIDGE_URL: ${LEARNGRAPH_HOST_BRIDGE_URL:-}
  # 宿主服务访问策略：auto（默认：容器化 profile 自动走 Host Service Bridge）|
  # bridge（强制桥接）| direct（可信桌面直连：loopback URL 改写为
  # host.docker.internal:同端口，无需 Bridge/token/注册/审计，仅建议 Windows/
  # macOS Docker Desktop 个人可信环境；沙箱容器绝不继承）| off（关闭全部改写）。
  LEARNGRAPH_HOST_ACCESS_MODE: ${LEARNGRAPH_HOST_ACCESS_MODE:-auto}
  LEARNGRAPH_CORS_ORIGINS: ${LEARNGRAPH_CORS_ORIGINS:-["http://127.0.0.1:18000","http://localhost:18000"]}
  LEARNGRAPH_ALLOW_PRIVATE_BRIDGE_URLS: ${LEARNGRAPH_ALLOW_PRIVATE_BRIDGE_URLS:-true}
  LEARNGRAPH_SANDBOX_ENABLED: ${LEARNGRAPH_SANDBOX_ENABLED:-true}
  # Code release default wins when unset (config.py DEFAULT_SANDBOX_PREBUILT_IMAGE).
  LEARNGRAPH_SANDBOX_PREBUILT_IMAGE: ${LEARNGRAPH_SANDBOX_PREBUILT_IMAGE:-}

services:
  app:
    # Sole build source for the shared main image `learngraph:local`;
    # preview/egress-proxy reference it by tag only (concurrent BuildKit
    # exports of the same tag race and fail with "image already exists").
    image: ${LEARNGRAPH_IMAGE:-learngraph:local}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # Host binding default is loopback-only, mirroring `npm run dev`
      # (listenHost defaults to 127.0.0.1). Set LEARNGRAPH_LISTEN_HOST=0.0.0.0
      # to expose on LAN/public.
      - "${LEARNGRAPH_LISTEN_HOST:-127.0.0.1}:${LEARNGRAPH_PORT:-18000}:8000"
    extra_hosts:
      # Docker gateway alias used by the Host Service Bridge (and by
      # host.docker.internal URLs during migration). Required so app/preview
      # can reach the real machine's bridge listener.
      - "host.docker.internal:host-gateway"
    environment:
      <<: *app-environment
      # Bridge bearer token mounted from the real machine (written by
      # scripts/host-bridge.mjs). The backend sends it as
      # X-LearnGraph-Host-Bridge-Token on outbound bridge calls. If the file
      # is absent (bridge not launched yet) the mount becomes an empty dir and
      # the backend simply skips the header — the providers page shows an
      # actionable hint instead of failing silently.
      LEARNGRAPH_HOST_BRIDGE_TOKEN_FILE: /run/secrets/host-bridge-token
      # sandboxd control plane（沙箱运行时控制面）的容器间互联：同栈 sandboxd
      # 服务，app 经内部网络 http://sandboxd:8090 访问，凭据由 sandboxd 首启时
      # 自举写入共享卷 sandboxd-state（app 只读挂载），宿主零配置、零 Node。
      # docker-compose.sandbox.yml 加固形态会覆盖为 compose secrets 路径。
      LEARNGRAPH_SANDBOX_BACKEND: sandboxd
      LEARNGRAPH_SANDBOXD_URL: ${LEARNGRAPH_SANDBOXD_URL:-http://sandboxd:8090}
      LEARNGRAPH_SANDBOXD_TOKEN_FILE: ${LEARNGRAPH_SANDBOXD_TOKEN_FILE:-/data/sandboxd/sandboxd-token}
      LEARNGRAPH_SANDBOXD_ADMIN_TOKEN_FILE: ${LEARNGRAPH_SANDBOXD_ADMIN_TOKEN_FILE:-/data/sandboxd/sandboxd-admin-token}
      LEARNGRAPH_SANDBOXD_DEPLOYMENT_ID: ${LEARNGRAPH_SANDBOXD_DEPLOYMENT_ID:-learngraph-compose}
    volumes:
      - learngraph-data:/data
      - "${LEARNGRAPH_HOST_BRIDGE_TOKEN_FILE:-./data/host-bridge/token}:/run/secrets/host-bridge-token:ro"
      # sandboxd 自举凭据与状态（共享卷，只读；token 由 sandboxd 首启生成）。
      - sandboxd-state:/data/sandboxd:ro
    depends_on:
      sandboxd:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/livez', timeout=4)",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    stop_grace_period: 20s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  preview:
    # Shares the main image built by the `app` service (identical Dockerfile,
    # different command). NO build section here — letting every service build
    # the same `learngraph:local` tag makes BuildKit race on the export and
    # fail with `image already exists`.
    image: ${LEARNGRAPH_IMAGE:-learngraph:local}
    command:
      [
        "python",
        "-m",
        "uvicorn",
        "app.preview:preview_app",
        "--host",
        "0.0.0.0",
        "--port",
        "8001",
        "--proxy-headers",
        "--forwarded-allow-ips",
        "*",
      ]
    ports:
      - "${LEARNGRAPH_LISTEN_HOST:-127.0.0.1}:${LEARNGRAPH_PREVIEW_PORT:-18001}:8001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      <<: *app-environment
      LEARNGRAPH_HOST_BRIDGE_TOKEN_FILE: /run/secrets/host-bridge-token
    volumes:
      - learngraph-data:/data
      - "${LEARNGRAPH_HOST_BRIDGE_TOKEN_FILE:-./data/host-bridge/token}:/run/secrets/host-bridge-token:ro"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/v1/livez', timeout=4)",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    stop_grace_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  egress-proxy:
    # The only component with sandbox internet egress. Attached to the
    # internal `learngraph-egress` network (which dynamic sandbox containers
    # join via the host Docker Engine) plus the default outbound network.
    # Reads reviewed policy files from the shared data volume; every
    # allow/deny decision is appended to the JSONL audit log.
    # Shares the main image built by `app` (no build section, same reason as
    # preview: concurrent exports of one tag would race in BuildKit).
    image: ${LEARNGRAPH_IMAGE:-learngraph:local}
    entrypoint: ["tini", "--", "python", "-m", "app.services.egress_proxy_main"]
    environment:
      LEARNGRAPH_SANDBOX_EGRESS_POLICY_DIR: /data/egress-policies
      LEARNGRAPH_SANDBOX_EGRESS_PROXY_HOST: "0.0.0.0"
      LEARNGRAPH_SANDBOX_EGRESS_PROXY_PORT: "8888"
      LEARNGRAPH_EGRESS_PROXY_AUDIT_LOG: /data/egress-audit.jsonl
    volumes:
      - learngraph-data:/data
    networks:
      - default
      - learngraph-egress
    user: "1000:1000"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; s = socket.create_connection(('127.0.0.1', 8888), timeout=4); s.close()",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s
    stop_grace_period: 10s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # sandboxd: the only component that talks to Docker Engine (mounts the host
  # socket). It manages sandbox containers, named volumes and per-sandbox
  # egress networks; the app never sees the socket. On first start the
  # entrypoint self-bootstraps service + admin tokens into the shared
  # `sandboxd-state` volume (idempotent — reviewed secrets mounted by
  # docker-compose.sandbox.yml are respected and never overwritten), so
  # `docker compose up` needs zero host-side setup and no Node runtime.
  sandboxd:
    # Distinct image tag: the app/preview/egress-proxy share the main image
    # name, so sandboxd must NOT reuse `learngraph:local` or the last build
    # wins and the daemon container would run the app image.
    image: ${LEARNGRAPH_SANDBOXD_IMAGE:-learngraph-sandboxd:local}
    build:
      context: .
      dockerfile: sandboxd/Dockerfile
    environment:
      SANDBOXD_LISTEN_HOST: "0.0.0.0"
      SANDBOXD_PORT: "8090"
      SANDBOXD_TOKEN_FILE: /data/sandboxd/sandboxd-token
      SANDBOXD_ADMIN_TOKEN_FILE: /data/sandboxd/sandboxd-admin-token
      SANDBOXD_DEPLOYMENT_ID: ${LEARNGRAPH_SANDBOXD_DEPLOYMENT_ID:-learngraph-compose}
      # Immutable runtime image digest for runners; empty keeps the daemon
      # fail-closed until the settings page「沙箱一键初始化」pulls + pins +
      # smokes the prebuilt image (LEARNGRAPH_SANDBOX_PREBUILT_IMAGE or the
      # code-release default).
      SANDBOXD_RUNTIME_IMAGE: ${LEARNGRAPH_SANDBOX_IMAGE:-}
      SANDBOXD_EGRESS_ENABLED: "true"
      SANDBOXD_EGRESS_PROXY_URL: http://egress-proxy:8888
      SANDBOXD_EGRESS_PROXY_CONTAINER: egress-proxy
      SANDBOXD_STATE_PATH: /data/sandboxd/state.db
      SANDBOXD_SECCOMP_DIR: /app/sandbox-profiles
      SANDBOXD_MAX_ACTIVE: "20"
    volumes:
      # Host Docker Engine socket (Docker Desktop WSL2 and native Linux alike).
      - /var/run/docker.sock:/var/run/docker.sock
      - sandboxd-state:/data/sandboxd
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/v1/health/live', timeout=4)",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    stop_grace_period: 15s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  learngraph-data:
  # sandboxd state + self-bootstrapped tokens (shared read-only with app).
  sandboxd-state:

networks:
  # Internal bridge on the host Docker Engine: dynamic sandbox containers join
  # it by name, so the network name MUST stay exactly `learngraph-egress`
  # (matching LEARNGRAPH_SANDBOX_EGRESS_NETWORK) and is pinned to skip the
  # compose project-name prefix.
  learngraph-egress:
    internal: true
    name: learngraph-egress
