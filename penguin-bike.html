<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>企鹅的兜风日</title>
  <style>
    * { box-sizing: border-box; }
    :root { --ink: #243e47; --speed: 1.2s; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f3eb; color: var(--ink); font-family: "Microsoft YaHei", system-ui, sans-serif; }
    main { width: min(960px, 100%); padding: 40px 24px 24px; text-align: center; }
    .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 4px; color: #71897e; }
    h1 { margin: 16px 0 12px; font-size: clamp(30px, 6vw, 50px); letter-spacing: 3px; }
    .subtitle { margin: 0; font-size: 14px; color: #7a8986; letter-spacing: 2px; }
    .scene { width: 100%; display: block; margin: 18px auto 0; overflow: hidden; }
    .spin { animation: spin var(--speed) linear infinite; transform-box: fill-box; transform-origin: center; }
    .bob { animation: bob .6s ease-in-out infinite alternate; }
    .scarf { animation: flutter .45s ease-in-out infinite alternate; transform-origin: 407px 225px; }
    .road { animation: road calc(var(--speed) * 2) linear infinite; }
    .cloud { animation: drift 16s ease-in-out infinite alternate; }
    .paused * { animation-play-state: paused !important; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { to { transform: translateY(-3px); } }
    @keyframes flutter { to { transform: rotate(5deg); } }
    @keyframes road { to { transform: translateX(-180px); } }
    @keyframes drift { to { transform: translateX(-35px); } }
    .controls { display: flex; justify-content: center; gap: 12px; margin: 8px 0 28px; }
    button { border: 1px solid #cad6c9; border-radius: 30px; padding: 12px 24px; background: transparent; color: var(--ink); cursor: pointer; font: inherit; font-size: 13px; transition: background .2s, transform .2s; }
    button:first-child { color: white; background: #355e50; border-color: #355e50; }
    button:hover { transform: translateY(-2px); background: #e3e9dc; }
    button:first-child:hover { background: #254b3e; }
    button:focus-visible { outline: 3px solid #e6a44f; outline-offset: 4px; }
    footer { font-size: 11px; letter-spacing: 2px; color: #96a097; }
    @media (prefers-reduced-motion: reduce) { .scene * { animation-play-state: paused !important; } }
  </style>
</head>
<body>
<main>
  <div class="eyebrow">A LITTLE RIDE · A LITTLE JOY</div>
  <h1>今天，骑着快乐出发。</h1>
  <p class="subtitle">不赶时间的小企鹅，正在去看世界的路上。</p>
  <svg class="scene" viewBox="0 0 900 470" role="img" aria-labelledby="scene-title scene-desc">
    <title id="scene-title">企鹅骑着薄荷绿自行车兜风</title>
    <desc id="scene-desc">戴着橙色围巾的小企鹅在山间骑车，车轮与脚踏转动，路边的小草向后移动。</desc>
    <defs>
      <clipPath id="land"><rect x="35" y="35" width="830" height="385" rx="170"/></clipPath>
      <g id="wheel">
        <circle r="65" fill="#f5f3eb" stroke="#29424a" stroke-width="9"/>
        <circle r="54" fill="none" stroke="#bfd3c6" stroke-width="2"/>
        <g stroke="#a9bcb4" stroke-width="2"><path d="M-58 0H58M0-58V58M-41-41L41 41M-41 41L41-41"/></g>
        <circle r="7" fill="#29424a"/>
      </g>
    </defs>
    <g clip-path="url(#land)">
      <rect x="35" y="35" width="830" height="385" fill="#e4eee3"/>
      <circle cx="676" cy="105" r="40" fill="#f3ce7d"/>
      <g class="cloud" fill="#fafbf3"><path d="M160 120c-15-25 16-41 32-24 6-35 55-32 60 1 29-8 40 24 17 28H160Z"/><path d="M520 78c-9-16 10-28 22-15 9-24 39-19 40 1 22-4 26 17 10 18h-69Z"/></g>
      <path d="M0 300Q130 126 292 300Q459 137 644 291Q777 163 920 278V430H0Z" fill="#cfdfcc"/>
      <path d="M0 326Q192 240 386 334Q645 238 910 330V435H0Z" fill="#b7cead"/>
      <path d="M0 385Q460 367 900 385V470H0Z" fill="#e9e4d3"/>
      <path d="M0 384H900" stroke="#9caf99" stroke-width="2"/>
      <g class="road" stroke="#a6b69a" stroke-width="3" stroke-linecap="round">
        <path d="M120 358l-5-10m5 10 6-7M300 358l-5-10m5 10 6-7M480 358l-5-10m5 10 6-7M660 358l-5-10m5 10 6-7M840 358l-5-10m5 10 6-7M1020 358l-5-10m5 10 6-7"/>
        <path d="M40 406h28m152 0h28m152 0h28m152 0h28m152 0h28m152 0h28" stroke="#cfcab6"/>
      </g>
    </g>
    <ellipse cx="450" cy="389" rx="180" ry="10" fill="#718571" opacity=".12"/>
    <g transform="translate(337 317)"><g class="spin"><use href="#wheel"/></g></g>
    <g transform="translate(574 317)"><g class="spin"><use href="#wheel"/></g></g>
    <g fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M337 317L398 232 444 317ZM398 232H541L444 317M541 232l33 85" stroke="#355d53" stroke-width="11"/>
      <path d="M337 317L398 232 444 317M398 232H541L444 317" stroke="#83b7a0" stroke-width="6"/>
      <path d="M398 232l-9-25M530 203l44 114" stroke="#355d53" stroke-width="8"/>
      <path d="M530 203l-6-21q-3-12 10-12h21" stroke="#29424a" stroke-width="7"/>
      <path d="M372 209h38" stroke="#29424a" stroke-width="12"/>
    </g>
    <g class="bob">
      <path d="M427 269l26 34" stroke="#d99438" stroke-width="17" stroke-linecap="round"/>
      <path d="M407 224Q369 195 354 222Q380 239 397 247" fill="#243e47"/>
      <path d="M397 133C417 109 459 121 469 151C474 171 466 188 475 210C492 245 470 279 429 279C380 279 367 249 382 211C390 191 381 155 397 133Z" fill="#263f48"/>
      <path d="M409 155C420 142 437 153 442 169C461 154 466 180 456 197C462 213 478 247 455 260C432 277 396 259 397 235C397 212 393 174 409 155Z" fill="#faf9ed"/>
      <path d="M466 167l24 10-24 10q-9-9 0-20" fill="#e6a444"/>
      <circle cx="448" cy="160" r="4" fill="#263f48"/>
      <circle cx="449" cy="159" r="1.2" fill="white"/>
      <ellipse cx="447" cy="185" rx="8" ry="5" fill="#e5aba0" opacity=".7"/>
      <path class="scarf" d="M411 212Q376 201 340 217l10 11-14 9q43-18 78-11" fill="#d57548"/>
      <path d="M392 206q31 16 73-3l3 13q-35 19-77-1Z" fill="#e38a53"/>
      <path d="M435 216Q457 244 499 211" fill="none" stroke="#263f48" stroke-width="18" stroke-linecap="round"/>
      <path d="M498 211l29-21" stroke="#263f48" stroke-width="12" stroke-linecap="round"/>
    </g>
    <g transform="translate(444 317)">
      <circle r="18" fill="#f5f3eb" stroke="#355d53" stroke-width="5"/>
      <g class="spin">
        <circle r="34" fill="none"/>
        <path d="M-21-21L21 21" stroke="#29424a" stroke-width="5"/>
        <path d="M-30-21h18M12 21h18" stroke="#29424a" stroke-width="6" stroke-linecap="round"/>
        <path d="M11 16q8-14 15-3l8 10H10Z" fill="#e6a444"/>
      </g>
    </g>
    <g stroke="#92aaa0" stroke-width="3" stroke-linecap="round"><path d="M300 216h35M286 232h34M303 248h20"/></g>
  </svg>
  <div class="controls">
    <button id="pause" type="button" aria-pressed="false">Ⅱ 停下来歇歇</button>
    <button id="speed" type="button" aria-pressed="false">↗ 骑快一点</button>
  </div>
  <footer>保持好奇，慢慢前行。 EVERY LITTLE PEDAL COUNTS.</footer>
</main>
<script>
  const scene = document.querySelector('.scene');
  const pause = document.querySelector('#pause');
  const speed = document.querySelector('#speed');
  pause.addEventListener('click', () => {
    const paused = scene.classList.toggle('paused');
    pause.textContent = paused ? '▶ 继续兜风' : 'Ⅱ 停下来歇歇';
    pause.setAttribute('aria-pressed', String(paused));
  });
  speed.addEventListener('click', () => {
    const fast = speed.getAttribute('aria-pressed') !== 'true';
    document.documentElement.style.setProperty('--speed', fast ? '.55s' : '1.2s');
    speed.setAttribute('aria-pressed', String(fast));
    speed.textContent = fast ? '↘ 慢慢骑就好' : '↗ 骑快一点';
  });
</script>
</body>
</html>
