[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "learngraph-backend"
version = "0.1.0"
description = "LearnGraph FastAPI MVP backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "python-multipart>=0.0.9,<1",
  "httpx>=0.27,<1",
  "cryptography>=43,<47",
  "keyring>=25.6,<26",
  "jsonschema>=4.23,<5",
  "pypdf>=5,<7",
  "xlrd>=2.0.2,<3",
  "pillow>=10,<12",
  "docker>=7.1,<8",
  # IANA zone database for zoneinfo on Windows (and minimal Linux images).
  # Required by Agent get_current_time (e.g. Asia/Shanghai).
  "tzdata>=2024.1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
]
infrastructure = [
  "minio>=7.2,<8",
  "psycopg[binary]>=3.2,<4",
  "pymysql>=1.1,<2",
  "redis>=5,<7",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
