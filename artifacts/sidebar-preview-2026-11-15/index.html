rder-radius:4px;padding:5px 8px}

<svg aria-hidden="true" style="position:absolute;width:0;height:0;overflow:hidden"><defs>
<symbol id="search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="7.3"/><path d="m16.3 16.3 4.5 4.5"/></symbol>

<symbol id="files" viewBox="0 0 24 24"><path d="M8 3h8l4 4v13a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1Z"/><path d="M15 3v5h5M3 7v11a2 2 0 0 0 2 2"/></symbol>

<div id="root"></div>
<dialog id="search-dialog" aria-label="搜索会话与资料"><header><svg><use href="#search"/></svg><input aria-label="搜索" placeholder="搜索会话、文件和消息…"><button class="icon-btn" aria-label="关闭搜索"><svg><use href="#close"/></svg></button></header><h2>最近打开</h2><div class="results"></div></dialog>
<script>
const icon=name=>`<svg aria-hidden="true"><use href="#${name}"/></svg>`;
const action=(name,label,cls='')=>`<button type="button" class="icon-btn ${cls}" aria-label="${label}" title="${label}" data-action="${name}">${icon(name==='search'?'search':name==='collapse'?'panel':name==='new-project'?'plus':name==='new-session'?'plus':name==='menu'?'more':name)}</button>`;
const recentTitles=['分析计算机专业发展','画出我的记忆','自我介绍总结','设计语义发现技能','分析真实需求'];
function session(title,active=false){return `<div class="session${active?' active':''}"><button class="session-title" data-action="session" title="${title}">${title}</button><div class="row-actions">${action('menu','管理会话 '+title)}</div></div>`}
function project(title,open=false,hover=false){return `<div class="project"><div class="project-row${hover?' show-actions':''}"><button class="folder-toggle" aria-label="${open?'收起':'展开'}项目 ${title}" aria-expanded="${open}" data-action="folder">${icon(open?'folder-open':'folder')}</button><button class="project-title" data-action="project">${title}</button><div class="row-actions">${action('new-session','在 '+title+' 中新建对话')}${action('menu','管理项目 '+title)}</div></div><div class="children"${open?'':' hidden'}>${session('TCP 为什么需要三次握手',title==='计算机网络')}${session('拥塞控制与流量控制')}</div></div>`}
function sidebar(hover=false){return `<aside class="sidebar" aria-label="LearnGraph 侧边栏"><header class="brand-row"><span class="brand">${icon('network')}LearnGraph</span>${action('search','搜索会话、文件和消息','top-search')}${action('collapse','折叠侧边栏')}</header><button class="new-chat" data-action="new-session">${icon('edit')}<span>新对话</span></button><div class="scroll"><nav class="navigation" aria-label="主导航">${[['network','图谱'],['files','资料'],['box','产物'],['calendar','定时任务'],['more','更多']].map(([i,l])=>`<button class="nav-row" data-action="nav">${icon(i)}<span>${l}</span></button>`).join('')}</nav><section class="section"><div class="section-heading"><button class="section-toggle" data-action="section" aria-label="折叠项目分组" aria-expanded="true">项目</button>${action('new-project','新建项目')}${action('menu','项目分组管理','quiet-action')}</div><div class="projects section-content">${project('机器学习')}${project('计算机网络',true,hover)}${project('LearnGraph')}${project('论文阅读')}</div></section><section class="section recent"><div class="section-heading"><button class="section-toggle" data-action="section" aria-label="折叠最近分组" aria-expanded="true">最近</button>${action('menu','最近会话管理','quiet-action')}</div><div class="recent-list section-content">${recentTitles.map(t=>session(t)).join('')}</div></section></div><button class="account" data-action="account"><span class="avatar">WH</span><span class="account-text"><span class="account-name">worlds hello</span><span class="account-meta">个人工作区</span></span></button></aside>`}
const mode=new URLSearchParams(location.search).get('view');
if(mode==='app')document.querySelector('#root').innerHTML=`<div class="app">${sidebar()}<main class="main"><header class="main-header"><button class="icon-btn mobile-toggle" data-action="expand" aria-label="展开侧边栏">${icon('panel')}</button><span>新对话</span><span class="preview-tag">侧边栏设计预览</span></header><div class="welcome"><h1>今天想学点什么？</h1><p>从一个问题开始，逐步建立理解。</p><div class="composer"><input aria-label="输入消息" placeholder="提出问题，或描述你的学习目标…"><div class="composer-tools">${action('plus','添加附件')}<span>默认模型</span>${action('mic','语音输入')}${action('up','发送','send')}</div></div></div><div class="page-notice">独立设计稿 · 不连接真实数据</div></main></div>`;
else document.querySelector('#root').innerHTML=`<main class="board"><div class="eyebrow">LEARNGRAPH / SIDEBAR STUDY</div><h1>让标题成为侧边栏的主角</h1><p class="intro">顶部常驻搜索 · 项目与最近分组 · 中性图标 · 操作跟随对象</p><div class="columns"><section class="state"><p class="state-label">默认状态</p><div class="frame">${sidebar()}</div></section><section class="state"><p class="state-label">悬停「计算机网络」</p><div class="frame">${sidebar(true)}</div></section><aside class="notes"><div class="note"><div class="note-index">01 / 入口</div><h2>搜索始终在顶部</h2><p>与品牌、收起按钮同一行。<br>滚动会话时依然可以使用。</p></div><div class="note"><div class="note-index">02 / 层级</div><h2>项目、最近，分别折叠</h2><p>点击分组文字即可展开或收起。<br>两个分组互不影响，不增加箭头。</p></div><div class="note"><div class="note-index">03 / 操作</div><h2>管理操作回到对应位置</h2><p>项目分组旁新建项目；<br>悬停项目时，新建对话和更多出现。<br>没有额外三角箭头。</p></div><div class="note"><div class="note-index">04 / 视觉</div><h2>只突出当前会话</h2><p>父级项目保持无底色，悬停也一样。<br>只保留当前会话的浅灰选中底色。</p></div><a class="desktop-link" href="?view=app">查看整体布局</a></aside></div><p class="footer-note">设计预览 · 侧边栏宽度 268px · 示例内容 · 尚未修改正式界面</p></main>`;
const dialog=document.querySelector('dialog'),search=dialog.querySelector('input');
function searchResults(){const q=search.value.trim();const titles=['TCP 为什么需要三次握手','拥塞控制与流量控制',...recentTitles].filter(t=>!q||t.toLowerCase().includes(q.toLowerCase()));dialog.querySelector('.results').replaceChildren(...titles.map(t=>{const b=document.createElement('button');b.textContent=t;b.onclick=()=>{notify('预览：打开 '+t);dialog.close()};return b}));if(!titles.length)dialog.querySelector('.results').innerHTML='<div class="empty">没有匹配的示例内容</div>'}
function openSearch(){search.value='';searchResults();dialog.showModal();search.focus()}
search.oninput=searchResults;dialog.querySelector('button').onclick=()=>dialog.close();
function notify(text){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.textContent=text;document.body.append(t);setTimeout(()=>t.remove(),2200)}
function menu(button){document.querySelector('.popover')?.remove();const menu=document.createElement('div');menu.className='popover';menu.setAttribute('role','menu');const label=button.getAttribute('aria-label');const opts=label==='项目分组管理'?['折叠全部项目','批量管理项目']:label==='最近会话管理'?['批量管理会话','查看已归档']:label.startsWith('管理项目')?['重命名','归档项目','删除项目']:['重命名','置顶','归档'];opts.forEach(t=>{const item=document.createElement('button');item.setAttribute('role','menuitem');item.textContent=t;item.onclick=()=>{if(t==='折叠全部项目'){button.closest('.sidebar').querySelectorAll('.folder-toggle[aria-expanded="true"]').forEach(b=>b.click())}else notify('预览操作：'+t);menu.remove()};menu.append(item)});document.body.append(menu);const r=button.getBoundingClientRect();menu.style.left=Math.min(r.right+6,window.innerWidth-menu.offsetWidth-12)+'px';menu.style.top=Math.min(r.top,window.innerHeight-menu.offsetHeight-12)+'px'}
document.addEventListener('click',e=>{if(!e.target.closest('.popover')&&!e.target.closest('[data-action="menu"]'))document.querySelector('.popover')?.remove();const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='search')openSearch();if(a==='section'){const collapsed=b.closest('.section').classList.toggle('is-collapsed');b.setAttribute('aria-expanded',String(!collapsed));b.setAttribute('aria-label',(collapsed?'展开':'折叠')+b.textContent+'分组')}if(a==='folder'){const expanded=b.getAttribute('aria-expanded')==='true';b.setAttribute('aria-expanded',String(!expanded));b.setAttribute('aria-label',(expanded?'展开':'收起')+'项目 '+b.nextElementSibling.textContent);b.innerHTML=icon(expanded?'folder':'folder-open');b.closest('.project').querySelector('.children').hidden=expanded}if(a==='menu')menu(b);if(a==='session'){const s=b.closest('.sidebar');s.querySelectorAll('.session').forEach(row=>row.classList.remove('active'));b.closest('.session').classList.add('active')}if(a==='project')notify('预览：进入项目 '+b.textContent);if(a==='nav'){b.closest('nav').querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');notify('预览：'+b.textContent)}if(a==='new-session')notify('预览：新建对话');if(a==='account')notify('预览：账户与设置');if(a==='new-project'){const s=b.closest('.sidebar');if(b.closest('.section').classList.contains('is-collapsed'))b.closest('.section').querySelector('.section-toggle').click();if(s.querySelector('.project-create'))return;const f=document.createElement('form');f.className='project-create';f.innerHTML='<input aria-label="项目名称" placeholder="项目名称" required><button type="submit">新建</button>';b.closest('.section').querySelector('.projects').prepend(f);f.querySelector('input').focus();f.onsubmit=e=>{e.preventDefault();const title=f.querySelector('input').value.trim();if(title){const temp=document.createElement('div');temp.innerHTML=project('新项目');const row=temp.firstElementChild;row.querySelector('.project-title').textContent=title;row.querySelector('.folder-toggle').setAttribute('aria-label','展开项目 '+title);f.replaceWith(row)}}}if(a==='collapse'){const app=b.closest('.app');if(app)app.classList.add('collapsed');else notify('预览：收起侧边栏')}if(a==='expand')b.closest('.app').classList.remove('collapsed')});
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelector('.popover')?.remove();if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();openSearch()}});
</script>
</body></html>
