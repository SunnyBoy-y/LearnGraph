name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  updater:
    name: Independent updater recovery and authorization
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s updater/tests -v

  secrets:
    name: Current source secret scan (including tests)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Install pinned Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/gitleaks-bin"
          tar -xzf "$archive" -C "$RUNNER_TEMP/gitleaks-bin" gitleaks
      - name: Scan current committed source and test fixtures
        shell: bash
        run: |
          set -euo pipefail
          snapshot="$(mktemp -d "$RUNNER_TEMP/secret-scan.XXXXXX")"
          trap 'rm -rf -- "$snapshot"' EXIT
          git archive --format=tar HEAD | tar -xf - -C "$snapshot"
          "$RUNNER_TEMP/gitleaks-bin/gitleaks" dir "$snapshot" --redact=100 --no-banner

  mobile:
    name: Android unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"
      - run: npm ci
      - run: npm run build
      - run: npm run cap:sync
      - name: Android local unit tests
        working-directory: mobile/android
        run: bash ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:testDebugUnitTest --no-daemon
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-results
          path: mobile/android/app/build/test-results/
          if-no-files-found: warn
      - name: Install shared renderer dependencies
        working-directory: frontend
        run: npm ci
      - name: Build shared Web message renderer
        working-directory: mobile
        run: npm run build:renderer
      - name: Native Compose client unit tests and APK
        working-directory: mobile/native
        run: bash ./gradlew -Dorg.gradle.java.home="$JAVA_HOME" :app:testDebugUnitTest :app:assembleCompact --no-daemon
      - name: Upload native test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-test-results
          path: mobile/native/app/build/test-results/
          if-no-files-found: warn

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Unit and UI tests
        run: npm run test -- --reporter=default --reporter=junit --outputFile=test-results/junit.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-test-results
          path: frontend/test-results/
          if-no-files-found: warn
      - run: npm run build:check

  sandboxd:
    name: sandboxd (control plane unit/contract)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: sandboxd
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install dependencies
        run: uv sync --locked --extra test
      - name: Syntax check
        run: >
          uv run --locked --extra test python -c
          "from pathlib import Path; files = sorted(Path('sandboxd').rglob('*.py'));
          assert files; [compile(f.read_bytes(), str(f), 'exec') for f in files];
          print(f'Syntax checked {len(files)} Python files.')"
      - name: Import check
        run: uv run --locked --extra test python -c "from sandboxd.main import create_app; assert create_app"
      - name: Unit and contract tests (fake runtime, no Docker)
        run: uv run --locked --extra test pytest tests -q --junitxml=test-results/junit.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sandboxd-test-results
          path: sandboxd/test-results/
          if-no-files-found: warn

  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NLTK_DATA: ${{ github.workspace }}/docker/nltk_data
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - name: Install test and voice dependencies
        run: uv sync --locked --extra test --extra voice
      - name: Syntax check
        run: >
          uv run --locked --extra test --extra voice python -c
          "from pathlib import Path; files = sorted(Path('app').rglob('*.py'));
          assert files; [compile(f.read_bytes(), str(f), 'exec') for f in files];
          print(f'Syntax checked {len(files)} Python files.')"
      - name: Import application
        run: uv run --locked --extra test --extra voice python -c "from app.main import app; assert app.title"
      - name: Verify official Skill packages
        run: uv run --locked --extra test --extra voice python scripts/verify_skill_packages.py
      - name: Unit and API tests
        run: uv run --locked --extra test --extra voice pytest tests -q -m "not integration" --junitxml=test-results/junit.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: backend/test-results/
          if-no-files-found: warn
