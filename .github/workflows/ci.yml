name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build:check

  sandboxd:
    name: sandboxd (control plane unit/contract)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sandboxd
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked --extra test
      - name: Syntax check
        run: >
          uv run --locked python -c
          "from pathlib import Path; files = sorted(Path('sandboxd').rglob('*.py'));
          assert files; [compile(f.read_bytes(), str(f), 'exec') for f in files];
          print(f'Syntax checked {len(files)} Python files.')"
      - name: Import check
        run: uv run --locked python -c "from sandboxd.main import create_app; assert create_app"
      - name: Unit and contract tests (local-only tests, skipped when absent)
        run: >
          if [ -d tests ]; then uv run --locked --extra test pytest tests -q; else
          echo 'sandboxd tests are kept local-only per project convention; skipping.'; fi

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Syntax check
        run: >
          uv run --locked python -c
          "from pathlib import Path; files = sorted(Path('app').rglob('*.py'));
          assert files; [compile(f.read_bytes(), str(f), 'exec') for f in files];
          print(f'Syntax checked {len(files)} Python files.')"
      - name: Import application
        run: uv run --locked python -c "from app.main import app; assert app.title"
      - name: Unit and API tests
        run: uv run --locked --extra test pytest tests -q
