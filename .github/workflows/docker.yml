name: Docker

on:
  pull_request:
    paths:
      - "Dockerfile"
      - "VERSION"
      - ".dockerignore"
      - "docker-compose.yml"
      - "docker-compose.sandbox.yml"
      - "docker-compose.updater.yml"
      - "updater/**"
      - "docker/**"
      - "frontend/**"
      - "backend/app/**"
      - "backend/sandbox/**"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - "sandboxd/**"
      - ".github/workflows/docker.yml"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "Dockerfile"
      - "VERSION"
      - ".dockerignore"
      - "docker-compose.yml"
      - "docker-compose.sandbox.yml"
      - "docker-compose.updater.yml"
      - "updater/**"
      - "docker/**"
      - "frontend/**"
      - "backend/app/**"
      - "backend/sandbox/**"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - "sandboxd/**"
      - ".github/workflows/docker.yml"
  workflow_dispatch:
  release:
    types: [published]

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build and smoke
    runs-on: ubuntu-latest
    steps:
      - name: Refuse local or shared runners before checkout
        run: |
          set -eu
          [ "${GITHUB_ACTIONS:-}" = true ] && [ "${RUNNER_ENVIRONMENT:-}" = github-hosted ] && [ -z "${ACT:-}" ] \
            || { echo "Docker smoke requires a disposable GitHub-hosted runner; checkout refused" >&2; exit 1; }
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Require fresh isolated Docker daemon
        run: python -m updater.tests.ci_docker_isolation

      - name: Lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/learngraph" >> "$GITHUB_ENV"

      - name: Release version and database compatibility
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || '' }}
        run: |
          python - <<'PY'
          import os, pathlib, re
          tag = os.environ['RELEASE_TAG']
          version = pathlib.Path('VERSION').read_text().strip()
          if not re.fullmatch(r'v?(0|[1-9]\d*)\.(0|[1-9]\d*)(?:\.(0|[1-9]\d*))?', version):
              raise SystemExit('VERSION must use a stable release tag, for example v0.5 or v1.2.3')
          if tag and tag != version:
              raise SystemExit(f'Release tag {tag!r} differs from VERSION {version!r}; update VERSION before publishing')
          compatibility = pathlib.Path('docker/update-compatibility').read_text().strip()
          assert re.fullmatch(r'[0-9]+', compatibility)
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              output.write(f'APP_VERSION={version}\nUPDATE_COMPATIBILITY={compatibility}\n')
          PY

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compose file is valid
        run: docker compose -f docker-compose.yml config >/dev/null

      - name: Sandbox override is valid
        run: docker compose -f docker-compose.yml -f docker-compose.sandbox.yml config >/dev/null

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=ref,event=tag
            type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: |
            learngraph:ci
            ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.version=${{ env.APP_VERSION }}
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
            UPDATE_COMPATIBILITY=${{ env.UPDATE_COMPATIBILITY }}
            SOURCE_REPOSITORY=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build sandboxd image for compose smoke
        run: docker build -f sandboxd/Dockerfile -t learngraph-sandboxd:local .

      - name: Smoke Compose stack
        env:
          LEARNGRAPH_IMAGE: learngraph:ci
          LEARNGRAPH_ENV: development
          COMPOSE_PROJECT_NAME: lg-ci-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          docker compose up -d --no-build
          trap 'docker compose logs --no-color || true; docker compose down -v' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18000/api/v1/livez >/dev/null \
              && curl -fsS http://127.0.0.1:18001/api/v1/livez >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              echo "services did not become live in time" >&2
              exit 1
            fi
            sleep 3
          done
          curl -fsS http://127.0.0.1:18000/api/v1/health | tee /tmp/health.json
          python - <<'PY'
          import json
          payload = json.loads(open("/tmp/health.json", encoding="utf-8").read())
          assert payload["status"] == "ok", payload
          assert payload["service"] == "learngraph-backend", payload
          PY
          curl -fsS -D /tmp/spa.headers -o /tmp/spa.html http://127.0.0.1:18000/
          grep -q "<div id=\"root\">" /tmp/spa.html
          grep -qi "text/html" /tmp/spa.headers
          curl -fsS -o /tmp/route.html http://127.0.0.1:18000/auth/login
          grep -q "<div id=\"root\">" /tmp/route.html
          # Egress proxy must be listening inside its container and healthy.
          egress_id=$(docker compose ps -q egress-proxy)
          for attempt in $(seq 1 20); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$egress_id" 2>/dev/null || echo missing)
            [ "$status" = "healthy" ] && break
            [ "$attempt" -eq 20 ] && { echo "egress-proxy not healthy: $status" >&2; exit 1; }
            sleep 3
          done
          docker compose exec -T egress-proxy python -c "import socket; socket.create_connection(('127.0.0.1', 8888), timeout=4).close()"
          # PostgreSQL provisioner shares the image, but only its dedicated
          # service receives Docker access. Business roles must never get it.
          for service in app egress-proxy; do
            service_id=$(docker compose ps -q "$service")
            if docker inspect --format '{{range .Mounts}}{{.Destination}} {{end}}' "$service_id" | grep -q '/var/run/docker.sock'; then
              echo "business service unexpectedly has Docker access" >&2
              exit 1
            fi
          done
          # Exactly three resident roles; provisioning is an explicit profile.
          [ "$(docker compose ps --status running --services | wc -l)" -eq 3 ]
          ! docker compose ps --status running --services | grep -qx database-migration-agent
          docker compose exec -T app python -m app.container_runtime health
          # The egress network must exist on the host Docker Engine and be
          # internal (dynamic sandbox containers join it by name).
          docker network inspect --format '{{.Internal}} {{.Name}}' learngraph-egress | grep -q 'true'

      - name: Verify updater with real isolated containers
        env:
          LEARNGRAPH_UPDATE_TEST_BASE: learngraph:ci
        run: python -m updater.tests.docker_roundtrip

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.version=${{ env.APP_VERSION }}
          build-args: |
            APP_VERSION=${{ env.APP_VERSION }}
            UPDATE_COMPATIBILITY=${{ env.UPDATE_COMPATIBILITY }}
            SOURCE_REPOSITORY=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  sandboxd:
    name: sandboxd control plane
    runs-on: ubuntu-latest
    steps:
      - name: Refuse local or shared runners before checkout
        run: |
          set -eu
          [ "${GITHUB_ACTIONS:-}" = true ] && [ "${RUNNER_ENVIRONMENT:-}" = github-hosted ] && [ -z "${ACT:-}" ] \
            || { echo "Docker smoke requires a disposable GitHub-hosted runner; checkout refused" >&2; exit 1; }
      - uses: actions/checkout@v6

      - name: Require fresh isolated Docker daemon
        run: python -m updater.tests.ci_docker_isolation

      - name: Build sandboxd image
        run: docker build -f sandboxd/Dockerfile -t sandboxd:ci .

      - name: Build app image
        run: docker build -f Dockerfile -t learngraph:ci .

      - name: Business image must not expose a Docker endpoint
        run: |
          set -euo pipefail
          docker run --rm --network none --read-only --entrypoint python learngraph:ci -c "import os,sys; from pathlib import Path; sys.exit('business image exposes Docker' if Path('/var/run/docker.sock').exists() or os.environ.get('DOCKER_HOST') else 0)"

      - name: Run sandboxd against the host socket and assert the control plane
        run: |
          set -euo pipefail
          secrets_dir=/tmp/sandboxd-ci-secrets
          mkdir -p "$secrets_dir"
          openssl rand -hex 32 > "$secrets_dir/token"
          openssl rand -hex 32 > "$secrets_dir/admin-token"
          socket_gid=$(stat -c %g /var/run/docker.sock)
          docker network create sandbox-control-ci >/dev/null 2>&1 || true
          # sandboxd persists its SQLite state under SANDBOXD_STATE_PATH; the
          # container runs --read-only, so /tmp must be a writable tmpfs
          # (production Compose mounts a volume for /var/lib/sandboxd).
          docker run -d --name sandboxd-ci \
            --network sandbox-control-ci \
            -v /var/run/docker.sock:/var/run/docker.sock \
            --group-add "$socket_gid" \
            --tmpfs /tmp \
            -e SANDBOXD_LISTEN_HOST=0.0.0.0 \
            -e SANDBOXD_PORT=8090 \
            -e SANDBOXD_TOKEN_FILE=/run/secrets/token \
            -e SANDBOXD_ADMIN_TOKEN_FILE=/run/secrets/admin-token \
            -e SANDBOXD_DEPLOYMENT_ID=ci \
            -e SANDBOXD_EGRESS_ENABLED=false \
            -e SANDBOXD_STATE_PATH=/tmp/state.db \
            -v "$secrets_dir":/run/secrets:ro \
            --read-only \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            sandboxd:ci
          trap 'docker rm -f sandboxd-ci >/dev/null 2>&1 || true; docker network rm sandbox-control-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 30); do
            if docker exec sandboxd-ci python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/v1/health/live', timeout=3)" >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "sandboxd did not become live" >&2
              docker logs sandboxd-ci || true
              exit 1
            fi
            sleep 2
          done
          docker exec -i sandboxd-ci python - <<'PY'
          import json
          import urllib.request

          def get(path: str, token: str):
              req = urllib.request.Request(
                  "http://127.0.0.1:8090" + path,
                  headers={"Authorization": "Bearer " + token},
              )
              return json.load(urllib.request.urlopen(req, timeout=5))

          token = open("/run/secrets/token", encoding="utf-8").read().strip()
          ready = get("/v1/health/ready", token)
          assert ready.get("docker") is True, ready
          caps = get("/v1/capabilities", token)
          assert "max_file_bytes" in (caps.get("limits") or {}), caps
          print("sandboxd docker ping ok; control plane authenticated")
          PY
          # A non-managed network name must never be touchable through the API:
          # create without an immutable runtime image must fail closed.
          docker exec -i sandboxd-ci python - <<'PY'
          import json
          import urllib.request
          token = open("/run/secrets/token", encoding="utf-8").read().strip()
          body = json.dumps({
              "protocol_version": "1.0",
              "session_id": "ci-fail-closed",
              "workspace_key": "ci-fail-closed",
              "owner": {"deployment_id": "ci", "workspace_id": "", "session_id": "ci-fail-closed"},
              "runtime_kind": "python-node",
              "memory_bytes": 268435456,
              "memory_swap_bytes": 268435456,
              "cpu_count": 1.0,
              "pids_max": 64,
              "disk_bytes": 1048576,
              "egress": None,
              "ttl_seconds": 3600,
              "idempotency_key": "ci-fail-closed",
          }).encode("utf-8")
          req = urllib.request.Request(
              "http://127.0.0.1:8090/v1/sandboxes",
              data=body,
              headers={"Authorization": "Bearer " + token, "Content-Type": "application/json"},
              method="POST",
          )
          try:
              urllib.request.urlopen(req, timeout=5)
          except urllib.error.HTTPError as exc:
              assert exc.code in (400, 503), exc.code
              print("create without runtime image fails closed: ok")
          else:
              raise AssertionError("create without runtime image must fail closed")
          PY
