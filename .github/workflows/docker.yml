name: Docker

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "docker-compose.sandbox.yml"
      - "docker/**"
      - "frontend/**"
      - "backend/app/**"
      - "backend/sandbox/**"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - ".github/workflows/docker.yml"
  push:
    branches:
      - main
    tags:
      - "v*"
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "docker-compose.sandbox.yml"
      - "docker/**"
      - "frontend/**"
      - "backend/app/**"
      - "backend/sandbox/**"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - ".github/workflows/docker.yml"
  workflow_dispatch:

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: Build and smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Lowercase image name
        run: echo "IMAGE_NAME=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/learngraph" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compose file is valid
        run: docker compose -f docker-compose.yml config >/dev/null

      - name: Sandbox override is valid
        run: docker compose -f docker-compose.yml -f docker-compose.sandbox.yml config >/dev/null

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: |
            learngraph:ci
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke Compose stack
        env:
          LEARNGRAPH_IMAGE: learngraph:ci
          LEARNGRAPH_ENV: development
        run: |
          set -euo pipefail
          docker compose up -d --no-build
          trap 'docker compose logs --no-color || true; docker compose down -v' EXIT
          for attempt in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8080/api/v1/livez >/dev/null \
              && curl -fsS http://127.0.0.1:8001/api/v1/livez >/dev/null; then
              break
            fi
            if [ "$attempt" -eq 40 ]; then
              echo "services did not become live in time" >&2
              exit 1
            fi
            sleep 3
          done
          curl -fsS http://127.0.0.1:8080/api/v1/health | tee /tmp/health.json
          python - <<'PY'
          import json
          payload = json.loads(open("/tmp/health.json", encoding="utf-8").read())
          assert payload["status"] == "ok", payload
          assert payload["service"] == "learngraph-backend", payload
          PY
          curl -fsS -D /tmp/spa.headers -o /tmp/spa.html http://127.0.0.1:8080/
          grep -q "<div id=\"root\">" /tmp/spa.html
          grep -qi "text/html" /tmp/spa.headers
          curl -fsS -o /tmp/route.html http://127.0.0.1:8080/auth/login
          grep -q "<div id=\"root\">" /tmp/route.html

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
