name: Memory architecture checks

on:
  pull_request:
    paths:
      - "backend/app/**"
      - "backend/tests/**"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - "frontend/src/features/memory/**"
      - "frontend/src/api/**"
      - "frontend/src/types/**"
      - ".github/workflows/memory-checks.yml"
  push:
    branches: [main]
    paths:
      - "backend/app/**"
      - "backend/tests/**"
      - "backend/pyproject.toml"
      - "backend/uv.lock"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NLTK_DATA: ${{ github.workspace }}/docker/nltk_data
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv run --locked --extra test --extra voice pytest tests -q -m "not integration"
      - run: uv run --locked --extra test --extra voice python -c "from app.main import app; print(app.title)"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build:check
