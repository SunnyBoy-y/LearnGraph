# Hardening override: reviewed file-based credentials + isolated control
# network for the sandboxd control plane.
#
# The MAIN docker-compose.yml already ships a self-contained sandboxd service
# (host socket mount + self-bootstrapped tokens on the shared state volume),
# so plain `docker compose up -d --build` gives you sandbox execution with
# zero host setup — on Docker Desktop (Windows/macOS) and native Linux alike.
# Use this override only when you want the hardened shape:
#
#   export LEARNGRAPH_DATA_DIR=/var/lib/learngraph   # optional host data path
#   mkdir -p secrets && openssl rand -hex 32 > secrets/sandboxd-token
#   openssl rand -hex 32 > secrets/sandboxd-admin-token
#   docker compose -f docker-compose.yml -f docker-compose.sandbox.yml up -d
#
# In this shape the daemon reads reviewed tokens from compose secrets
# (/run/secrets/…) and runs on the internal `sandbox-control` network only.
# If its health check reports "Docker Engine is unavailable", pass the host
# GID: export DOCKER_GID=$(stat -c %g /var/run/docker.sock)

services:
  # LearnGraph app: consumes the sandboxd Sandbox API only.
  app:
    environment:
      LEARNGRAPH_SANDBOX_BACKEND: sandboxd
      LEARNGRAPH_SANDBOXD_URL: http://sandboxd:8090
      LEARNGRAPH_SANDBOXD_TOKEN_FILE: /run/secrets/sandboxd-token
      LEARNGRAPH_SANDBOXD_ADMIN_TOKEN_FILE: /run/secrets/sandboxd-admin-token
      LEARNGRAPH_SANDBOXD_DEPLOYMENT_ID: ${LEARNGRAPH_SANDBOXD_DEPLOYMENT_ID:-learngraph-compose}
      LEARNGRAPH_SANDBOX_ENABLED: "true"
    secrets:
      - sandboxd-token
      - sandboxd-admin-token
    networks:
      - default
      - sandbox-control
    depends_on:
      sandboxd:
        condition: service_healthy

  # The only Docker control plane. No host ports are published; the daemon
  # listens on the internal `sandbox-control` network only.
  sandboxd:
    # Distinct image tag (do NOT share `learngraph:local` with the app
    # services or the last build wins and the daemon runs the app image).
    image: ${LEARNGRAPH_SANDBOXD_IMAGE:-learngraph-sandboxd:local}
    build:
      context: .
      dockerfile: sandboxd/Dockerfile
    environment:
      SANDBOXD_LISTEN_HOST: "0.0.0.0"
      SANDBOXD_PORT: "8090"
      SANDBOXD_TOKEN_FILE: /run/secrets/sandboxd-token
      SANDBOXD_ADMIN_TOKEN_FILE: /run/secrets/sandboxd-admin-token
      SANDBOXD_DEPLOYMENT_ID: ${LEARNGRAPH_SANDBOXD_DEPLOYMENT_ID:-learngraph-compose}
      # Immutable runtime image digest for sandbox runners. Empty keeps the
      # daemon fail-closed (readiness reports the missing runtime).
      SANDBOXD_RUNTIME_IMAGE: ${LEARNGRAPH_SANDBOX_IMAGE:-}
      SANDBOXD_EGRESS_ENABLED: "true"
      SANDBOXD_EGRESS_PROXY_URL: http://egress-proxy:8888
      SANDBOXD_EGRESS_PROXY_CONTAINER: egress-proxy
      SANDBOXD_STATE_PATH: /var/lib/sandboxd/state.db
      SANDBOXD_SECCOMP_DIR: /app/sandbox-profiles
      SANDBOXD_MAX_ACTIVE: "20"
    group_add:
      - ${DOCKER_GID:-998}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - sandboxd-state:/var/lib/sandboxd
    secrets:
      - sandboxd-token
      - sandboxd-admin-token
    networks:
      - sandbox-control
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=67108864,mode=1777
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8090/v1/health/live', timeout=4)",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    stop_grace_period: 15s
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

secrets:
  sandboxd-token:
    file: ${LEARNGRAPH_SANDBOXD_TOKEN_FILE:-./secrets/sandboxd-token}
  # Higher-privilege bootstrap control plane (pull + digest + smoke). Generate a
  # separate token: openssl rand -hex 32 > secrets/sandboxd-admin-token
  sandboxd-admin-token:
    file: ${LEARNGRAPH_SANDBOXD_ADMIN_TOKEN_FILE:-./secrets/sandboxd-admin-token}

volumes:
  sandboxd-state:

networks:
  # Internal control network between app and sandboxd. The daemon publishes no
  # host port; sandbox runner containers are attached to per-sandbox egress
  # networks by the daemon and never join this network.
  sandbox-control:
    internal: true
