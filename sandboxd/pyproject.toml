[project]
name = "sandboxd"
version = "0.1.0"
description = "LearnGraph isolated sandbox control plane (Docker runtime owner)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "docker>=7.1,<8",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<10",
  "httpx>=0.27,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires a real Docker Engine / sandboxd runtime",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sandboxd*"]
