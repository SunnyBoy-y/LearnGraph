<svg xmlns="http://www.w3.org/2000/svg" width="2048" height="1260" viewBox="0 0 2048 1260" role="img" aria-labelledby="title desc">
  <title id="title">LearnGraph 右侧栏折叠时的画布定位对比</title>
  <desc id="desc">左侧是修改前，聊天内容在释放后的主栏中重新居中；右侧是修改后，内容列的左边界锚定在全局宽度三分之一处。</desc>
  <defs>
    <filter id="panel-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#17202a" flood-opacity=".10" />
    </filter>
    <filter id="canvas-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#17202a" flood-opacity=".12" />
    </filter>
    <linearGradient id="canvas-top" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff" />
      <stop offset="1" stop-color="#eef5ff" />
    </linearGradient>
    <linearGradient id="after-line" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0ea5e9" />
      <stop offset="1" stop-color="#14b8a6" />
    </linearGradient>
    <pattern id="empty-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#e9edf2" stroke-width="1" />
    </pattern>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#0ea5e9" />
    </marker>
    <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0 0L10 5L0 10Z" fill="#7c8796" />
    </marker>
  </defs>

  <rect width="2048" height="1260" fill="#f4f6f8" />
  <text x="72" y="64" fill="#15202b" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="30" font-weight="700">LearnGraph</text>
  <text x="72" y="103" fill="#6b7280" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18">右侧侧边栏折叠时，中间画布的定位变化</text>
  <text x="1976" y="70" text-anchor="end" fill="#7c8796" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16">代码绘制预览 · desktop &gt; 1120px</text>

  <!-- Before -->
  <g id="before-panel">
    <rect x="32" y="142" width="976" height="1008" rx="24" fill="#ffffff" filter="url(#panel-shadow)" />
    <rect x="32" y="142" width="976" height="1008" rx="24" fill="none" stroke="#dce2e8" stroke-width="2" />
    <circle cx="76" cy="194" r="17" fill="#f3e5c7" />
    <text x="76" y="200" text-anchor="middle" fill="#9a6700" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700">前</text>
    <text x="108" y="201" fill="#1f2937" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="23" font-weight="700">修改前 · 右栏折叠后重新居中</text>
    <text x="108" y="230" fill="#7b8794" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15">主栏变宽，内容列仍按剩余空间自动居中</text>

    <rect x="64" y="268" width="912" height="840" rx="16" fill="#fbfcfd" stroke="#d9e0e7" stroke-width="2" />
    <rect x="64" y="268" width="174" height="840" rx="16" fill="#f7f8fa" />
    <rect x="220" y="268" width="18" height="840" fill="#f7f8fa" />
    <line x1="238" y1="268" x2="238" y2="1108" stroke="#e1e6ec" stroke-width="2" />

    <rect x="84" y="291" width="30" height="30" rx="9" fill="#20252b" />
    <circle cx="99" cy="306" r="8" fill="none" stroke="#ffffff" stroke-width="2" />
    <text x="124" y="313" fill="#20252b" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700">LearnGraph</text>
    <g fill="#626d79" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15">
      <text x="90" y="372">▣　新对话</text>
      <text x="90" y="414">♧　图谱</text>
      <text x="90" y="456">▱　资料</text>
      <text x="90" y="498">◇　产物</text>
      <text x="90" y="540">•••　更多</text>
    </g>
    <line x1="84" y1="573" x2="218" y2="573" stroke="#e1e6ec" />
    <text x="88" y="610" fill="#20252b" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700">会话</text>
    <g fill="#7b8794" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13">
      <text x="90" y="650">□　操作系统原理</text>
      <text x="90" y="688">□　数据结构与算法</text>
      <text x="90" y="726">□　SQL 查询入门</text>
      <text x="90" y="764">□　知识图谱练习</text>
    </g>

    <rect x="238" y="268" width="738" height="840" fill="url(#empty-grid)" opacity=".55" />
    <text x="252" y="302" fill="#a1aab5" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13">右侧栏已折叠，剩余区域保持可用</text>

    <!-- global one-third guide -->
    <line x1="368" y1="300" x2="368" y2="1068" stroke="#f59e0b" stroke-width="2" stroke-dasharray="8 8" opacity=".9" />
    <rect x="278" y="320" width="180" height="30" rx="15" fill="#fff7e6" stroke="#f2c36b" />
    <text x="368" y="340" text-anchor="middle" fill="#9a6700" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700">全局 1/3 参考线</text>

    <!-- before canvas -->
    <rect x="404" y="376" width="470" height="548" rx="18" fill="#ffffff" stroke="#dce3ea" stroke-width="2" filter="url(#canvas-shadow)" />
    <rect x="404" y="376" width="470" height="82" rx="18" fill="url(#canvas-top)" />
    <rect x="404" y="438" width="470" height="20" fill="url(#canvas-top)" />
    <text x="428" y="409" fill="#4b5563" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700">思考了 2m 31s　·　8 次工具调用</text>
    <text x="428" y="438" fill="#1f2937" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700">IoC：控制反转不是“没有对象”</text>
    <text x="428" y="487" fill="#6b7280" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14">下面按业务类 → 容器注册 → 依赖注入 → 代理对象展开。</text>
    <rect x="428" y="513" width="422" height="250" rx="14" fill="#f9fbfd" stroke="#e4e9ef" />
    <text x="450" y="546" fill="#273444" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700">IoC 容器：对象从哪里来？</text>
    <g font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13">
      <rect x="450" y="568" width="85" height="132" rx="10" fill="#eef5ff" stroke="#3b82f6" stroke-width="2" />
      <text x="462" y="594" fill="#1d4ed8" font-weight="700">① 业务类</text>
      <text x="462" y="620" fill="#5d6b7b">@Service</text>
      <text x="462" y="643" fill="#5d6b7b">@Bean</text>
      <text x="462" y="666" fill="#5d6b7b">配置元数据</text>
      <text x="548" y="637" fill="#8aa0b6" font-size="28">→</text>
      <rect x="579" y="568" width="92" height="132" rx="10" fill="#ffffff" stroke="#cdd8e3" stroke-width="2" />
      <text x="590" y="594" fill="#273444" font-weight="700">② 定义</text>
      <text x="590" y="620" fill="#5d6b7b">BeanDefinition</text>
      <text x="590" y="650" fill="#5d6b7b">类型 / 作用域</text>
      <text x="684" y="637" fill="#8aa0b6" font-size="28">→</text>
      <rect x="715" y="568" width="110" height="132" rx="10" fill="#ffffff" stroke="#cdd8e3" stroke-width="2" />
      <text x="726" y="594" fill="#273444" font-weight="700">③ 实例化</text>
      <text x="726" y="620" fill="#5d6b7b">解析构造器</text>
      <text x="726" y="650" fill="#5d6b7b">注入依赖</text>
      <text x="726" y="680" fill="#5d6b7b">完成装配</text>
    </g>
    <rect x="428" y="796" width="422" height="64" rx="10" fill="#f6f8fb" />
    <rect x="428" y="796" width="4" height="64" rx="2" fill="#3b82f6" />
    <text x="447" y="825" fill="#4b5563" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13">业务代码只声明“我需要 UserService”，</text>
    <text x="447" y="847" fill="#4b5563" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13">容器负责创建、组装与交付。</text>

    <line x1="368" y1="968" x2="404" y2="968" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow-gray)" />
    <text x="404" y="1000" fill="#9a6700" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700">内容列起点约 37%</text>
    <text x="64" y="1132" fill="#8a95a1" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13">折叠后仍按剩余主栏居中，左边界落在 1/3 线右侧</text>
  </g>

  <!-- After -->
  <g id="after-panel">
    <rect x="1040" y="142" width="976" height="1008" rx="24" fill="#ffffff" filter="url(#panel-shadow)" />
    <rect x="1040" y="142" width="976" height="1008" rx="24" fill="none" stroke="#dce2e8" stroke-width="2" />
    <circle cx="1084" cy="194" r="17" fill="#d9f5ef" />
    <text x="1084" y="200" text-anchor="middle" fill="#087f70" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="16" font-weight="700">后</text>
    <text x="1116" y="201" fill="#1f2937" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="23" font-weight="700">修改后 · 画布锚定全局 1/3</text>
    <text x="1116" y="230" fill="#7b8794" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15">内容行、学习画布和输入框共享同一条定位基准</text>

    <rect x="1072" y="268" width="912" height="840" rx="16" fill="#fbfcfd" stroke="#d9e0e7" stroke-width="2" />
    <rect x="1072" y="268" width="174" height="840" rx="16" fill="#f7f8fa" />
    <rect x="1228" y="268" width="18" height="840" fill="#f7f8fa" />
    <line x1="1246" y1="268" x2="1246" y2="1108" stroke="#e1e6ec" stroke-width="2" />
    <rect x="1092" y="291" width="30" height="30" rx="9" fill="#20252b" />
    <circle cx="1107" cy="306" r="8" fill="none" stroke="#ffffff" stroke-width="2" />
    <text x="1132" y="313" fill="#20252b" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="18" font-weight="700">LearnGraph</text>
    <g fill="#626d79" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15">
      <text x="1098" y="372">▣　新对话</text>
      <text x="1098" y="414">♧　图谱</text>
      <text x="1098" y="456">▱　资料</text>
      <text x="1098" y="498">◇　产物</text>
      <text x="1098" y="540">•••　更多</text>
    </g>
    <line x1="1092" y1="573" x2="1226" y2="573" stroke="#e1e6ec" />
    <text x="1096" y="610" fill="#20252b" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700">会话</text>
    <g fill="#7b8794" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13">
      <text x="1098" y="650">□　操作系统原理</text>
      <text x="1098" y="688">□　数据结构与算法</text>
      <text x="1098" y="726">□　SQL 查询入门</text>
      <text x="1098" y="764">□　知识图谱练习</text>
    </g>

    <rect x="1246" y="268" width="738" height="840" fill="url(#empty-grid)" opacity=".55" />
    <text x="1260" y="302" fill="#a1aab5" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13">右侧栏已折叠，释放出的区域保留为空白</text>

    <!-- target global one-third guide -->
    <line x1="1376" y1="300" x2="1376" y2="1068" stroke="url(#after-line)" stroke-width="3" stroke-dasharray="8 8" />
    <rect x="1286" y="320" width="180" height="30" rx="15" fill="#e9fbf7" stroke="#70d8c6" />
    <text x="1376" y="340" text-anchor="middle" fill="#087f70" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700">全局 1/3 参考线</text>

    <!-- after canvas, aligned to the guide -->
    <rect x="1376" y="376" width="470" height="548" rx="18" fill="#ffffff" stroke="#45b9a7" stroke-width="3" filter="url(#canvas-shadow)" />
    <rect x="1376" y="376" width="470" height="82" rx="18" fill="url(#canvas-top)" />
    <rect x="1376" y="438" width="470" height="20" fill="url(#canvas-top)" />
    <text x="1400" y="409" fill="#4b5563" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13" font-weight="700">思考了 2m 31s　·　8 次工具调用</text>
    <text x="1400" y="438" fill="#1f2937" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="20" font-weight="700">IoC：控制反转不是“没有对象”</text>
    <text x="1400" y="487" fill="#6b7280" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14">下面按业务类 → 容器注册 → 依赖注入 → 代理对象展开。</text>
    <rect x="1400" y="513" width="422" height="250" rx="14" fill="#f9fbfd" stroke="#e4e9ef" />
    <text x="1422" y="546" fill="#273444" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15" font-weight="700">IoC 容器：对象从哪里来？</text>
    <g font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13">
      <rect x="1422" y="568" width="85" height="132" rx="10" fill="#eefbf8" stroke="#14b8a6" stroke-width="2" />
      <text x="1434" y="594" fill="#087f70" font-weight="700">① 业务类</text>
      <text x="1434" y="620" fill="#5d6b7b">@Service</text>
      <text x="1434" y="643" fill="#5d6b7b">@Bean</text>
      <text x="1434" y="666" fill="#5d6b7b">配置元数据</text>
      <text x="1520" y="637" fill="#8aa0b6" font-size="28">→</text>
      <rect x="1551" y="568" width="92" height="132" rx="10" fill="#ffffff" stroke="#cdd8e3" stroke-width="2" />
      <text x="1562" y="594" fill="#273444" font-weight="700">② 定义</text>
      <text x="1562" y="620" fill="#5d6b7b">BeanDefinition</text>
      <text x="1562" y="650" fill="#5d6b7b">类型 / 作用域</text>
      <text x="1656" y="637" fill="#8aa0b6" font-size="28">→</text>
      <rect x="1687" y="568" width="110" height="132" rx="10" fill="#ffffff" stroke="#cdd8e3" stroke-width="2" />
      <text x="1698" y="594" fill="#273444" font-weight="700">③ 实例化</text>
      <text x="1698" y="620" fill="#5d6b7b">解析构造器</text>
      <text x="1698" y="650" fill="#5d6b7b">注入依赖</text>
      <text x="1698" y="680" fill="#5d6b7b">完成装配</text>
    </g>
    <rect x="1400" y="796" width="422" height="64" rx="10" fill="#f6fbfa" />
    <rect x="1400" y="796" width="4" height="64" rx="2" fill="#14b8a6" />
    <text x="1419" y="825" fill="#4b5563" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13">业务代码只声明“我需要 UserService”，</text>
    <text x="1419" y="847" fill="#4b5563" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13">容器负责创建、组装与交付。</text>

    <line x1="1376" y1="968" x2="1376" y2="968" stroke="#14b8a6" stroke-width="3" />
    <text x="1376" y="1000" fill="#087f70" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14" font-weight="700">内容列左边界 = 33.333vw</text>
    <text x="1072" y="1132" fill="#087f70" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="13">折叠右栏后，内容列、学习画布和输入框保持同一条 1/3 定位线</text>
  </g>

  <rect x="72" y="1182" width="1904" height="48" rx="14" fill="#ffffff" stroke="#dce2e8" />
  <circle cx="98" cy="1206" r="7" fill="#14b8a6" />
  <text x="118" y="1212" fill="#334155" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="15">实现对应：</text>
  <text x="208" y="1212" fill="#0f766e" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="14">--chat-canvas-offset: calc(33.333333vw - var(--sidebar-width))</text>
  <text x="1970" y="1212" text-anchor="end" fill="#7b8794" font-family="Arial, 'Microsoft YaHei', sans-serif" font-size="14">移动端抽屉布局保持原样</text>
</svg>
