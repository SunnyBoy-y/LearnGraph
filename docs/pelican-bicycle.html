<footer><span>一只鹈鹕，一辆单车，一整个好天气。</span><span>ILLUSTRATED WITH SVG · MADE FOR A SLOW DAY</span></footer>
<script>
(()=>{
 const $=id=>document.getElementById(id);
 const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
 let running=!reduced.matches,angle=0,last=null,speed=1;
 const toggle=$('toggle'),slider=$('speed');
 function sync(){toggle.setAttribute('aria-pressed',String(!running));toggle.setAttribute('aria-label',running?'暂停骑行':'继续骑行');$('toggle-icon').textContent=running?'Ⅱ':'▶';$('toggle-text').textContent=running?'歇一会儿':'继续出发';}
 toggle.addEventListener('click',()=>{running=!running;sync();});
 slider.addEventListener('input',()=>{speed=Number(slider.value);});
 reduced.addEventListener('change',e=>{running=!e.matches;sync();});
 document.addEventListener('visibilitychange',()=>{last=null;});
 function draw(){
  const x=520+28*Math.cos(angle),y=476+28*Math.sin(angle),fx=1040-x,fy=952-y;
  // Each ankle follows its pedal; the knee is solved from two fixed-length leg segments.
  function leg(id,hx,hy,tx,ty,a,b){
   const dx=tx-hx,dy=ty-hy,d=Math.hypot(dx,dy),along=(a*a-b*b+d*d)/(2*d),height=Math.sqrt(Math.max(0,a*a-along*along));
   const kx=hx+along*dx/d-height*dy/d,ky=hy+along*dy/d+height*dx/d;
   $(id).setAttribute('d',`M${hx} ${hy}L${kx} ${ky}L${tx} ${ty}`);
  }
  leg('near-leg',487,317,x,y,100,100);leg('far-leg',479,310,fx,fy,103,103);
  $('near-foot').setAttribute('d',`M${x-10} ${y}H${x+19}L${x+12} ${y-7}`);
  $('far-foot').setAttribute('d',`M${fx-10} ${fy}H${fx+17}`);
  $('crank-arm').setAttribute('d',`M${fx} ${fy}L${x} ${y}`);
  $('near-pedal').setAttribute('d',`M${x-13} ${y+5}H${x+13}`);
  $('far-pedal').setAttribute('d',`M${fx-13} ${fy+5}H${fx+13}`);
  const deg=angle*180/Math.PI*1.45;
  $('rear-wheel').setAttribute('transform',`rotate(${deg})`);$('front-wheel').setAttribute('transform',`rotate(${deg})`);
  $('scarf').setAttribute('transform',`rotate(${Math.sin(angle*2)*2.5} 553 203)`);
  $('road-dashes').setAttribute('transform',`translate(${-Math.sin(angle*.5)*14} 0)`);
 }
 function tick(t){if(last!==null&&running){angle=(angle+Math.min((t-last)/1000,.05)*2.8*speed)%(Math.PI*40);draw();}last=t;requestAnimationFrame(tick);}
 sync();draw();requestAnimationFrame(tick);
})();
</script>
