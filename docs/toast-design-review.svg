<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="660" viewBox="0 0 1160 660">
<defs><filter id="shadow" x="-20%" y="-50%" width="140%" height="220%"><feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#000" flood-opacity=".08"/></filter><style>text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;fill:#222} .muted{fill:#737373}.small{font-size:13px}.body{font-size:15px}.heading{font-size:22px;font-weight:600}.title{font-size:14px;font-weight:600}</style></defs>
<rect width="1160" height="660" fill="#f5f5f3"/>
<text x="44" y="49" font-size="26" font-weight="600">右上角通知浮窗：现状与建议</text>
<text x="44" y="77" class="small muted">现状依据运行时样式重绘，非截图。右侧为建议稿，未修改业务组件。</text>
<path d="M580 110V606" stroke="#dededb" stroke-width="1"/>
<text x="44" y="134" class="heading">目前 6.5 / 10</text><text x="610" y="134" class="heading">目标 9 / 10</text>
<text x="44" y="161" class="small muted">默认彩色提示，通用组件感较强</text><text x="610" y="161" class="small muted">中性浮层，准确分级，提供明确的下一步</text>
<rect x="44" y="190" width="492" height="131" rx="12" fill="#eeeeeb"/>
<rect x="156" y="222" width="356" height="53" rx="8" fill="#fffcf0" stroke="#fbeeb1" filter="url(#shadow)"/>
<circle cx="149" cy="215" r="10" fill="#fff" stroke="#eee"/><path d="m146 212 6 6m0-6-6 6" stroke="#444" stroke-width="1.3"/>
<path d="m177 242 7-13 7 13z" fill="#dc7609"/><path d="M184 233v4m0 2v1" stroke="#fff" stroke-width="1.3"/>
<text x="198" y="253" style="fill:#dc7609;font-size:13px">本次未能生成定制封面，已使用默认封面。</text>
<text x="44" y="359" class="body" font-weight="600">主要扣分点</text>
<text x="44" y="391" class="body">1. 整块彩色文字与底色，注意力权重偏高</text>
<text x="44" y="421" class="body">2. 关闭按钮悬在左上角外侧，目标只有 20px</text>
<text x="44" y="451" class="body">3. 没有跟随应用主题和字体令牌</text>
<text x="44" y="481" class="body">4. 等待、引导、失败混用错误提示</text>
<text x="44" y="511" class="body">5. 需要修复的问题缺少就近的处理动作</text>
<text x="44" y="557" class="small muted">原有基础可以保留：Sonner、关闭、队列与键盘能力。</text>
<text x="44" y="580" class="small muted">不必更换组件库，优先改全局封装和调用语义。</text>
<rect x="610" y="190" width="506" height="131" rx="12" fill="#eeeeeb"/>
<rect x="712" y="213" width="380" height="84" rx="12" fill="#fff" stroke="#dededb" stroke-width=".5" filter="url(#shadow)"/>
<circle cx="736" cy="239" r="8" fill="none" stroke="#a46516" stroke-width="1.5"/><path d="M736 235v4m0 3v1" stroke="#a46516" stroke-width="1.5"/>
<text x="756" y="244" class="title">已使用默认封面</text><text x="756" y="268" class="small muted">定制封面暂未生成，可稍后重新生成。</text>
<path d="m1068 234 8 8m0-8-8 8" stroke="#737373" stroke-width="1.4"/>
<text x="610" y="353" class="body" font-weight="600">只有需要处理时，才增加操作</text>
<rect x="712" y="375" width="380" height="100" rx="12" fill="#fff" stroke="#dededb" stroke-width=".5" filter="url(#shadow)"/>
<circle cx="736" cy="401" r="8" fill="none" stroke="#c0443c" stroke-width="1.5"/><path d="M736 397v4m0 3v1" stroke="#c0443c" stroke-width="1.5"/>
<text x="756" y="406" class="title">未能保存模型配置</text><text x="756" y="430" class="small muted">连接暂时中断，更改尚未保存。</text>
<text x="756" y="455" font-size="13" font-weight="600">重试</text><path d="m1068 396 8 8m0-8-8 8" stroke="#737373" stroke-width="1.4"/>
<rect x="712" y="495" width="380" height="56" rx="12" fill="#232323" stroke="#3b3b3b" stroke-width=".5" filter="url(#shadow)"/>
<path d="m729 522 5 5 9-10" fill="none" stroke="#b8cabb" stroke-width="1.6"/>
<text x="756" y="528" style="fill:#f2f2f2;font-size:14px">配置已保存</text><path d="m1068 519 8 8m0-8-8 8" stroke="#aaa" stroke-width="1.4"/>
<text x="610" y="581" class="small muted">进入 180–220ms / 位移 6–8px / 无回弹 / 减弱动态效果时移除位移</text>
<path d="M44 612H1116" stroke="#dededb" stroke-width=".5"/>
<text x="44" y="638" class="small muted">设计方向：准确、安静、易处理。具体参数为本项目建议，不是 Apple、OpenAI 或 Anthropic 的官方参数。</text>
</svg>